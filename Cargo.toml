[package]
name = "successlib"
version = "0.7.0"
edition = "2021"
description = "Core library for achieving goals, handles focus sessions, notes and sync"

[lib]
name = "successlib"
crate-type = ["rlib", "cdylib"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
fuzzy-matcher = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
thiserror = "2.0"
rand = "0.8"

[features]
default = ["uniffi"]
uniffi = ["dep:uniffi", "dep:uniffi_bindgen"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uniffi = { version = "0.30.0", features = ["cli", "tokio"], optional = true }
uniffi_bindgen = { version = "0.30.0", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Storage", "Window"] }
getrandom = { version = "0.2", features = ["js"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3.10"
pollster = "0.4"

[[bin]]
# This can be whatever name makes sense for your project, but the rest of this tutorial assumes uniffi-bindgen.
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi"]
